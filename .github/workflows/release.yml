name: Release

# Builds installable desktop apps and publishes GitHub Releases for downloads.
# Runs only on master. The dev branch is intentionally excluded.
#
# All third-party actions are pinned to a full commit SHA rather than a
# floating tag so a hijacked tag on the upstream action cannot silently
# execute new code with our TAURI_SIGNING_PRIVATE_KEY. Bumping a pin is a
# reviewable diff, not an invisible upgrade.

on:
  push:
    branches: [master]
  workflow_dispatch:

# One release at a time so per-base build numbers stay unique.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write

# Publicly-safe values only. TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) is
# intentionally NOT in the top-level env - it's scoped per-step to the build
# and signer steps that actually need it, so a compromised curl or npm script
# in an unrelated step can't read it out of the environment.
env:
  # Public R2 custom domain — used when writing updater fragment download URLs.
  UPDATER_DOWNLOAD_BASE_URL: https://updates.azalea.rexsystems.me
  R2_BUCKET: azalea-updates
  R2_ENDPOINT: https://f92074baafe52a6a6b5b47c82488090d.r2.cloudflarestorage.com

jobs:
  # Allocate "<base>+<N>" once: N resets to 1 whenever tauri.conf version base changes.
  version:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      build: ${{ steps.resolve.outputs.build }}
      stamped: ${{ steps.resolve.outputs.stamped }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve per-base build number
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/resolve-release-build.mjs

  build-windows:
    needs: [version]
    runs-on: windows-latest
    env:
      VITE_AZALEA_BUILD: ${{ needs.version.outputs.build }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-windows
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Reinstall platform-native bindings
        # npm#4828 / workspaces: optional rollup/esbuild/cli binaries can be skipped
        shell: bash
        run: |
          npm install --workspace @azalea/desktop --no-save --force \
            rollup esbuild @tauri-apps/cli

      - name: Stamp release version
        shell: bash
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Azalea (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:ci

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        shell: bash
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            apps/desktop/src-tauri/target/release/bundle \
            windows-x86_64 \
            apps/desktop/src-tauri/target/release/bundle/latest-fragment.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/latest-fragment.json

  build-linux:
    needs: [version]
    runs-on: ubuntu-24.04
    env:
      VITE_AZALEA_BUILD: ${{ needs.version.outputs.build }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-linux
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Reinstall platform-native bindings
        run: |
          npm install --workspace @azalea/desktop --no-save --force \
            rollup esbuild @tauri-apps/cli

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Azalea (deb + rpm + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux:ci

      - name: Sign Linux package updaters
        # createUpdaterArtifacts signs AppImage; rpm/deb need an explicit sign for
        # linux-x86_64-rpm / linux-x86_64-deb keys used by installed packages.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for pkg in \
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm \
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          do
            if [ ! -f "${pkg}.sig" ]; then
              echo "Signing $pkg"
              npm exec --workspace @azalea/desktop -- tauri signer sign "$pkg"
            else
              echo "Already signed: $pkg"
            fi
          done

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            apps/desktop/src-tauri/target/release/bundle \
            linux-x86_64 \
            apps/desktop/src-tauri/target/release/bundle/latest-fragment.json

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/deb/*.sig
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/rpm/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/release/bundle/latest-fragment.json

  build-macos:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            platform_key: darwin-aarch64
            artifact_name: macos-arm64
          - rust_target: x86_64-apple-darwin
            platform_key: darwin-x86_64
            artifact_name: macos-x64
    runs-on: macos-14
    env:
      VITE_AZALEA_BUILD: ${{ needs.version.outputs.build }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Separate keys so arm64 / x86_64 caches do not clobber each other.
          shared-key: desktop-macos-${{ matrix.rust_target }}
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Reinstall platform-native bindings
        run: |
          npm install --workspace @azalea/desktop --no-save --force \
            rollup esbuild @tauri-apps/cli
          node -e "require('rollup'); require('@tauri-apps/cli'); console.log('native bindings ok')"

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Azalea (macOS .app)
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:macos:ci -- --target ${{ matrix.rust_target }}

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ARCH_SUFFIX="${{ matrix.rust_target }}"
          ARCH_SUFFIX="${ARCH_SUFFIX/-apple-darwin/}"
          echo "arch_suffix=$ARCH_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          BUNDLE="apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$BUNDLE/macos" ]; then
            BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          fi
          APP="$BUNDLE/macos/Azalea.app"
          DMG_DIR="$BUNDLE/dmg"
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/Azalea_${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.arch_suffix }}.dmg"
          chmod +x .github/create-macos-dmg.sh
          .github/create-macos-dmg.sh "$APP" "$DMG" "Azalea"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        id: fragment
        run: |
          BUNDLE="${{ steps.dmg.outputs.bundle_dir }}"
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            "$BUNDLE" \
            ${{ matrix.platform_key }} \
            "$BUNDLE/latest-fragment.json"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.fragment.outputs.bundle_dir }}/dmg/*.dmg
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.app.tar.gz
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.sig
            ${{ steps.fragment.outputs.bundle_dir }}/latest-fragment.json

  publish:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    env:
      VITE_AZALEA_BUILD: ${{ needs.version.outputs.build }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Git tags avoid `+` (URL-unfriendly); app/manifest keep 0.1.3+1.
          echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ needs.version.outputs.build }}" >> "$GITHUB_OUTPUT"

      - name: Merge updater manifest
        run: |
          node .github/merge-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            artifacts \
            artifacts/latest.json
          cat artifacts/latest.json

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Installers / updater payloads (skip fragment JSON; merged latest.json is enough)
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \
          \) -exec cp -n {} release-files/ \;
          # Prefer AppImage / nsis updater payloads; keep all .sig files (rpm/deb/AppImage/exe)
          cp artifacts/latest.json release-files/latest.json
          ls -la release-files

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets missing; skip R2 upload."
            exit 1
          fi
          # awscli is preinstalled on ubuntu-latest; S3-compatible API for R2.
          aws s3 sync release-files/ "s3://${R2_BUCKET}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors
          # Always overwrite the updater manifest at the bucket root.
          aws s3 cp release-files/latest.json "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=60"
          echo "Published https://updates.azalea.rexsystems.me/latest.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Azalea v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})
          generate_release_notes: true
          files: release-files/*
          draft: false
          prerelease: false

