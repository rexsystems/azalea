name: azalea-server

on:
  push:
    branches: [master]
    paths:
      - "services/azalea-server/**"
      - ".github/workflows/azalea-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/azalea-server
  PACKAGE_NAME: azalea-server

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/azalea-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ env.PACKAGE_NAME }}"
          set +e
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER}/packages/container/${NAME}/visibility" \
            -f visibility=public
          org_rc=$?
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${NAME}/visibility" \
            -f visibility=public
          user_rc=$?
          set -e
          if [[ "$org_rc" -ne 0 && "$user_rc" -ne 0 ]]; then
            echo "Could not set package public automatically."
            echo "GitHub -> Packages -> ${NAME} -> Package settings -> Change visibility -> Public"
          else
            echo "Package visibility set to public (or already public)."
          fi
