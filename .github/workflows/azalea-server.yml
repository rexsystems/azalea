name: azalea-server

on:
  push:
    branches: [master]
    paths:
      - "services/azalea-server/**"
      - "apps/azalea-server-web/**"
      - ".github/workflows/azalea-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: azalea-server-images-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/azalea-server
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/azalea-server-web

jobs:
  docker-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=sha,format=long,prefix=,suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/azalea-server
          platforms: linux/${{ matrix.arch }}
          build-args: |
            AZALEA_BUILD_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=azalea-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=azalea-server-${{ matrix.arch }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Azalea sync API (azalea-server)

      - name: Ensure GHCR package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Org packages default to private on first publish. GITHUB_TOKEN often
          # cannot flip visibility; if this fails, set Public once in the UI.
          # Re-pushing tags does NOT reset visibility once Public.
          OWNER="${{ github.repository_owner }}"
          NAME="azalea-server"
          set +e
          status=$(gh api "orgs/${OWNER}/packages/container/${NAME}" --jq '.visibility' 2>/dev/null || echo unknown)
          echo "Current visibility: ${status}"
          if [[ "$status" == "public" ]]; then
            echo "Already public."
            exit 0
          fi
          out=$(gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "orgs/${OWNER}/packages/container/${NAME}" \
            -f visibility=public 2>&1)
          rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::CI cannot make this package public (common for org packages)."
            echo "Do this once (sticks across rebuilds):"
            echo "  https://github.com/orgs/${OWNER}/packages/container/package/${NAME}"
            echo "  Package settings -> Danger Zone -> Change visibility -> Public"
          fi

  docker-web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,format=long,prefix=,suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/azalea-server-web
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            NEXT_PUBLIC_AZALEA_API_URL=/api
            NEXT_PUBLIC_SITE_URL=
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=azalea-server-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=azalea-server-web-${{ matrix.arch }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Azalea self-host web front (nginx + /api proxy)

      - name: Ensure GHCR package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="azalea-server-web"
          set +e
          status=$(gh api "orgs/${OWNER}/packages/container/${NAME}" --jq '.visibility' 2>/dev/null || echo unknown)
          echo "Current visibility: ${status}"
          if [[ "$status" == "public" ]]; then
            echo "Already public."
            exit 0
          fi
          out=$(gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "orgs/${OWNER}/packages/container/${NAME}" \
            -f visibility=public 2>&1)
          rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::CI cannot make this package public (common for org packages)."
            echo "Do this once (sticks across rebuilds):"
            echo "  https://github.com/orgs/${OWNER}/packages/container/package/${NAME}"
            echo "  Package settings -> Danger Zone -> Change visibility -> Public"
          fi

  publish-manifests:
    needs: [docker-server, docker-web]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [azalea-server, azalea-server-web]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Publish AMD64 and ARM64 manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE,,}"
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tags[@]}" \
            "${image}:${GITHUB_SHA}-amd64" \
            "${image}:${GITHUB_SHA}-arm64"
