name: azalea-server

on:
  push:
    branches: [master]
    paths:
      - "services/azalea-server/**"
      - "apps/azalea-web/**"
      - ".github/workflows/azalea-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/azalea-server
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/azalea-web

jobs:
  docker-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/azalea-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Azalea sync API (azalea-server)

      - name: Ensure GHCR package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Org packages default to private on first publish. GITHUB_TOKEN often
          # cannot flip visibility; if this fails, set Public once in the UI.
          # Re-pushing tags does NOT reset visibility once Public.
          OWNER="${{ github.repository_owner }}"
          NAME="azalea-server"
          set +e
          status=$(gh api "orgs/${OWNER}/packages/container/${NAME}" --jq '.visibility' 2>/dev/null || echo unknown)
          echo "Current visibility: ${status}"
          if [[ "$status" == "public" ]]; then
            echo "Already public."
            exit 0
          fi
          out=$(gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "orgs/${OWNER}/packages/container/${NAME}" \
            -f visibility=public 2>&1)
          rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::CI cannot make this package public (common for org packages)."
            echo "Do this once (sticks across rebuilds):"
            echo "  https://github.com/orgs/${OWNER}/packages/container/package/${NAME}"
            echo "  Package settings -> Danger Zone -> Change visibility -> Public"
          fi

  docker-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/azalea-web
          push: true
          build-args: |
            NEXT_PUBLIC_AZALEA_API_URL=/api
            NEXT_PUBLIC_SITE_URL=
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Azalea self-host web front (nginx + /api proxy)

      - name: Ensure GHCR package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="azalea-web"
          set +e
          status=$(gh api "orgs/${OWNER}/packages/container/${NAME}" --jq '.visibility' 2>/dev/null || echo unknown)
          echo "Current visibility: ${status}"
          if [[ "$status" == "public" ]]; then
            echo "Already public."
            exit 0
          fi
          out=$(gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "orgs/${OWNER}/packages/container/${NAME}" \
            -f visibility=public 2>&1)
          rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::CI cannot make this package public (common for org packages)."
            echo "Do this once (sticks across rebuilds):"
            echo "  https://github.com/orgs/${OWNER}/packages/container/package/${NAME}"
            echo "  Package settings -> Danger Zone -> Change visibility -> Public"
          fi
