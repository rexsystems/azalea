# Local / CI: build the image from this folder instead of pulling GHCR.
services:
  azalea-server:
    build: .
    image: ghcr.io/rexsystems/azalea-server:latest
    env_file:
      - .env
    ports:
      - "9482:9482"
    environment:
      AZALEA_DATA_DIR: /data
      AZALEA_BIND: 0.0.0.0:9482
      RUST_LOG: azalea_server=info,tower_http=info
    volumes:
      - azalea-data:/data
    restart: unless-stopped

volumes:
  azalea-data:
