# Fresh VPS - no source tree needed. Pulls published GHCR images.
services:
  azalea-server:
    image: ghcr.io/rexsystems/azalea-server:latest
    env_file:
      - .env
    ports:
      # Prefer binding to localhost when Caddy/Nginx/Tunnel is in front:
      # - "127.0.0.1:9482:9482"
      - "9482:9482"
    environment:
      AZALEA_DATA_DIR: /data
      AZALEA_BIND: 0.0.0.0:9482
      RUST_LOG: azalea_server=info,tower_http=info
    volumes:
      - azalea-data:/data
    restart: unless-stopped

  # Optional reverse-proxy UI on :80 (enable with: docker compose --profile web up -d)
  azalea-web:
    profiles: ["web"]
    image: ghcr.io/rexsystems/azalea-web:latest
    ports:
      - "80:80"
    depends_on:
      - azalea-server
    restart: unless-stopped

volumes:
  azalea-data:
