server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Docker host-port maps (e.g. 9843:80), keep redirects relative so
  # browsers stay on the public host:port instead of stripping to :80.
  absolute_redirect off;
  port_in_redirect off;

  # ---------- Security headers (applied to every response) ----------
  # CSP: script-src 'self' assumes there are no inline <script> tags in the
  # Next.js output (see apps/azalea-web/src/app/page.tsx which uses a
  # <meta http-equiv="refresh"> instead of an inline script).
  # style-src keeps 'unsafe-inline' because Next.js/Tailwind ship inline
  # styles; tighten later with nonces if needed.
  # connect-src allowlists challenges.cloudflare.com for Turnstile.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # strict-origin-when-cross-origin ensures the reset-password token in the
  # URL is never sent to another origin as a Referer (also mitigated by the
  # reset-password page stripping the token from the URL on mount).
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Sync API (strip /api prefix)
  location /api/ {
    proxy_pass http://azalea-server:9482/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    # Cookies set by azalea-server (Set-Cookie: azalea_refresh=...) must
    # reach the browser unmodified. nginx forwards them by default.
  }

  location = / {
    return 302 /login;
  }

  location = /download {
    return 302 /login;
  }

  location = /pricing {
    return 302 /login;
  }

  # Static Next export: login.html etc. Never use $uri/ (that 403s on /login/).
  location / {
    rewrite ^/(.*)/$ /$1 permanent;
    try_files $uri $uri.html /login.html;
  }
}
