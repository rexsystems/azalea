server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sync API (strip /api prefix)
  location /api/ {
    proxy_pass http://azalea-server:9482/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location = / {
    return 302 /login;
  }

  location = /download {
    return 302 /login;
  }

  location = /pricing {
    return 302 /login;
  }

  location / {
    try_files $uri $uri/ $uri.html /login.html;
  }
}
