server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Docker host-port maps (e.g. 9843:80), keep redirects relative so
  # browsers stay on the public host:port instead of stripping to :80.
  absolute_redirect off;
  port_in_redirect off;

  # Sync API (strip /api prefix)
  location /api/ {
    proxy_pass http://azalea-server:9482/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location = / {
    return 302 /login;
  }

  location = /download {
    return 302 /login;
  }

  location = /pricing {
    return 302 /login;
  }

  # Static Next export: login.html etc. Never use $uri/ (that 403s on /login/).
  location / {
    rewrite ^/(.*)/$ /$1 permanent;
    try_files $uri $uri.html /login.html;
  }
}
