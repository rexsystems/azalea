[package]
name = "azalea"
version = "0.2.0"
description = "A modern open-source SSH terminal client"
authors = ["RexSystems"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "azalea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
russh = "0.63.2"
russh-sftp = "3"
rsa = { version = "0.10.0-rc.18", features = ["encoding", "std"] }
pkcs1 = { version = "0.8.0-rc.4", features = ["pem", "std"] }
pkcs8 = { version = "0.11", features = ["pem", "std", "encryption"] }
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "ecdsa", "p256", "p384", "p521", "dsa", "encryption"] }
base64 = "0.22"
parking_lot = "0.12"
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Floor for RUSTSEC-2026-0285 / GHSA-2mjx-qc3c-rqvc (transitive via reqwest/sentry/updater).
rustls = "0.23.45"
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
dotenvy = "0.15"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-prevent-default = "5"
aes = "0.9.3"
cbc = { version = "0.2", features = ["alloc", "block-padding", "zeroize"] }
hex = "0.4.3"
p256 = { version = "0.14", features = ["pem", "pkcs8"] }
p384 = { version = "0.14", features = ["pem", "pkcs8"] }
p521 = { version = "0.14", features = ["pem", "pkcs8"] }
hmac = "0.12"
sha1 = "0.10"
futures-util = "0.3.34"
scraper = "0.24"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
cpal = "0.18.2"
whisper-rs = { version = "0.16", default-features = false }
md-5 = "0.10"
portable-pty = "0.9"

# russh >= 0.61 advertises rsa-sha2-* correctly via PrivateKeyWithHashAlg +
# best_supported_rsa_hash; the local patches/russh fork is no longer needed.
